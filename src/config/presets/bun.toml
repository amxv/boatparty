# Bun: the Bun version package.json pins, node_modules installed once per bun.lock, bun run as the script runner.
#
# boat's image already has a Bun. Bun keeps its install cache in
# ~/.bun/install/cache, which survives a resume.
version = 1

[run]
# `boatparty cheers <name>` runs `bun run <name>` when [commands] has no <name>.
script = "bun run"

[run.env]
# A Bun pinned by package.json ("packageManager": "bun@<version>") is
# installed into ~/.bun/bin, which must come before the image's copy.
PATH = "/home/user/.bun/bin:$PATH"

[[ensure]]
# Install the pinned Bun, checked against Bun's published checksums.
name = "bun-version"
check = '''
want=$(sed -n 's/.*"packageManager": *"bun@\([0-9][0-9.]*\)".*/\1/p' package.json 2>/dev/null)
[ -z "$want" ] || [ "$(bun --version 2>/dev/null)" = "$want" ]
'''
run = '''
set -e
want=$(sed -n 's/.*"packageManager": *"bun@\([0-9][0-9.]*\)".*/\1/p' package.json)
[ -n "$want" ] || exit 0
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
base="https://github.com/oven-sh/bun/releases/download/bun-v$want"
curl -fsSL -o "$tmp/bun-linux-x64.zip" "$base/bun-linux-x64.zip"
curl -fsSL -o "$tmp/SHASUMS256.txt" "$base/SHASUMS256.txt"
(cd "$tmp" && grep ' bun-linux-x64.zip$' SHASUMS256.txt | sha256sum -c --quiet -)
unzip -q -d "$tmp" "$tmp/bun-linux-x64.zip"
mkdir -p "$HOME/.bun/bin"
install -m 0755 "$tmp/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
ln -sf bun "$HOME/.bun/bin/bunx"
'''

[[ensure]]
# Install node_modules when the lockfile or Bun changes, or when a restore
# left packages without their files.
name = "bun-install"
key_files = ["bun.lock", "bun.lockb"]
key_command = "bun --version"
check = '''
test -d node_modules && perl -e '
  my @packages = grep { !m{/\@[^/]*$} } glob("node_modules/*");
  push @packages, glob("node_modules/\@*/*");
  exit((grep { !-f "$_/package.json" } @packages) ? 1 : 0);
'
'''
run = "if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi"

[base]
warm = '''
if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then bun run build; fi
'''
stale_inputs = ["bun.lock", "bun.lockb", "package.json"]
