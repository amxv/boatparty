name: Windows live provider check

on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows-live:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    environment: windows-live
    env:
      TEST_PROJECT: win-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --only-binary=:all: pywinpty==3.1.2
      - name: Configure the scratch workspace
        shell: pwsh
        run: |
          "$env:SystemRoot\System32\OpenSSH" >> $env:GITHUB_PATH
          "$env:GITHUB_WORKSPACE\target\debug" >> $env:GITHUB_PATH
          "BOATPARTY_HOME=$env:RUNNER_TEMP\boatparty home" >> $env:GITHUB_ENV
          "TEST_CHECKOUT=$env:RUNNER_TEMP\live checkout" >> $env:GITHUB_ENV
          New-Item -ItemType Directory "$env:RUNNER_TEMP\live checkout" | Out-Null
      - name: Login with the temporary test key
        shell: pwsh
        env:
          TEST_CREDENTIAL: ${{ secrets.BOATPARTY_TEST_KEY }}
        run: |
          if (-not $env:TEST_CREDENTIAL) { throw 'Missing windows-live test credential' }
          $env:TEST_CREDENTIAL | boatparty login --key-stdin
      - name: Exercise the Windows client and its console
        run: python scripts/windows/live.py
      - name: Delete this run's sandbox
        if: always() && env.TEST_CHECKOUT != ''
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:TEST_CHECKOUT
          if (!(Test-Path boatparty.toml)) { exit 0 }
          $rows = boatparty pool --refresh --project $env:TEST_PROJECT --json | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($project in $rows.projects) {
            if ($project.project -ne $env:TEST_PROJECT) { throw 'Unexpected project in cleanup' }
            foreach ($member in $project.members) {
              boatparty rm $member.name
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }
          $rows = boatparty pool --refresh --project $env:TEST_PROJECT --json | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($rows.projects[0].members.Count -or $rows.projects[0].untracked.Count) {
            throw 'Live test sandbox still present'
          }
