name: Docs

# Production docs deploys from main; a same-repository pull request that
# changes docs/ gets a Preview deployment with its URL commented on the PR.
# Nothing else calls Vercel: its Git integration is disconnected. The docs
# check on every branch is the `docs` job in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# A production deploy is never cancelled by a later push: that push's run
# waits, then deploys the newer tree. Pull request checks still supersede.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    # A GitHub-hosted runner, so docs deploys spend no boat.dev starts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node for Vercel CLI
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Vercel affected-path logic
        run: bun run test:vercel

      - name: Check
        run: bun run check

      - name: Build static output for project-scoped Vercel deployment
        if: >-
          github.repository != 'amxv/rust-cli-template' &&
          vars.VERCEL_PROJECT_ID != '' &&
          (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        run: |
          set -euo pipefail
          bun run build
          node scripts/prepare-prebuilt.mjs

      # Only docs/** pushes reach this workflow. Vercel Git auto-deploys are
      # disabled so Rust-only pushes consume no deployment quota. Deployment is
      # skipped until the Vercel project variables and token secret exist.
      - name: Deploy production docs to Vercel
        # Vercel's Root Directory is docs/. Running from docs/ would resolve
        # that to docs/docs, so the deploy runs from the repository root.
        working-directory: .
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository != 'amxv/rust-cli-template' &&
          vars.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Set the VERCEL_TOKEN secret and the VERCEL_ORG_ID and VERCEL_PROJECT_ID variables to deploy the docs.' >&2
            exit 1
          fi
          # Project-scoped tokens can fail broad CLI project-settings queries.
          # The Build Output API bundle avoids 'vercel pull/build' entirely.
          # --prebuilt reads .vercel/output relative to the CLI's working
          # directory, not relative to Vercel's configured Root Directory.
          test -f docs/.vercel/output/config.json
          mkdir -p .vercel
          cp -R docs/.vercel/output .vercel/output
          test -f .vercel/output/config.json
          npx --yes vercel@latest deploy --prebuilt --prod --yes --non-interactive

      - name: Deploy docs preview to Vercel
        id: preview
        # Same-repository pull requests only: forks get no secrets.
        working-directory: .
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.repository != 'amxv/rust-cli-template' &&
          vars.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          test -f docs/.vercel/output/config.json
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cp -R docs/.vercel/output .vercel/output
          # v65+ prints multi-line JSON; take only the URL.
          deployment="$(npx --yes vercel@latest deploy --json --prebuilt --yes --non-interactive)"
          url="$(printf '%s\n' "$deployment" | jq -er '.deployment.url')"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'Docs preview: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the pull request
        if: github.event_name == 'pull_request' && steps.preview.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- boatparty-docs-preview -->';
            const url = process.env.PREVIEW_URL.startsWith('http') ? process.env.PREVIEW_URL : `https://${process.env.PREVIEW_URL}`;
            const body = `${marker}\nDocs preview: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
