name: CI

# Every job runs on a GitHub-hosted runner, so CI spends no boat.dev starts
# and nothing builds on a developer machine.

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/windows-live.yml"
      - ".github/actions/test-windows/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "Justfile"
      - "boatparty.toml"
      - "docs/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-windows

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        # rustup is preinstalled on the runner; this installs the channel
        # and components from rust-toolchain.toml.
        run: |
          # Images with a system-wide rustup at /usr/local/cargo and
          # CARGO_HOME unset need CARGO_HOME pointed at that installation.
          if [ -z "${CARGO_HOME:-}" ] && [ -x /usr/local/cargo/bin/rustup ]; then
            export CARGO_HOME=/usr/local/cargo
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          fi
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check shell scripts
        run: |
          shopt -s nullglob globstar
          scripts=(scripts/**/*.sh docs/public/install.sh)
          if [ ${#scripts[@]} -gt 0 ]; then
            for f in "${scripts[@]}"; do bash -n "$f"; done
            if ! command -v shellcheck >/dev/null; then
              sudo apt-get install -y --no-install-recommends shellcheck >/dev/null \
                || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck >/dev/null; }
            fi
            shellcheck "${scripts[@]}"
          fi

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Vercel affected-path logic
        run: bun run test:vercel

      - name: Check
        run: bun run check
