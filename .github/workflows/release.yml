name: Release

# Builds release binaries without GitHub-hosted runners and without the
# developer's machine:
# - Linux (x86_64, aarch64) on a boat.dev sandbox (`runs-on: boat`), cross
#   compiled with cargo-zigbuild against glibc 2.28 so the binaries run on
#   older distributions too;
# - macOS (arm64, x86_64) natively on a one-shot NoMac Mac driven from a boat
#   sandbox by scripts/build-macos.sh, which also runs the test suite on macOS.
# A pushed tag vX.Y.Z publishes a GitHub Release with tar.gz archives,
# SHA256SUMS and install.sh. A manual run, or a pull request that touches the
# release machinery, builds and packages without publishing (a dry run).
#
# Secrets: NOMAC_API_KEY (NoMac API key for the macOS job).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # A pull request that changes the release machinery gets a full dry run.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-macos.sh"
      - "scripts/install.sh"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: boat
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match Cargo.toml version $version"
              exit 1
            fi
            publish=true
          else
            tag="v$version"
            publish=false
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, tag $tag, prerelease $prerelease, publish $publish"

  linux:
    needs: plan
    runs-on: boat
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      GLIBC: "2.28"
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain and targets
        run: |
          # boat images ship a system-wide rustup at /usr/local/cargo with
          # RUSTUP_HOME set but CARGO_HOME unset, which some rustup commands
          # reject; point CARGO_HOME at the real installation.
          if [ -z "${CARGO_HOME:-}" ] && [ -x /usr/local/cargo/bin/rustup ]; then
            export CARGO_HOME=/usr/local/cargo
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          fi
          rustup toolchain install
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Install zig and cargo-zigbuild
        run: scripts/release/install-zigbuild.sh
      - name: Test
        run: cargo test --locked
      - name: Build and package
        run: |
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo zigbuild --release --locked --target "$target.$GLIBC"
            scripts/release/package.sh "${{ needs.plan.outputs.version }}" "$target" \
              "target/$target/release/boatparty" dist
          done
          file target/*/release/boatparty
          ./target/x86_64-unknown-linux-gnu/release/boatparty --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: plan
    runs-on: boat
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install the NoMac CLI
        run: npm install -g @nomac/cli@0.27.1
      - name: Build and test on a one-shot NoMac Mac
        env:
          NOMAC_API_KEY: ${{ secrets.NOMAC_API_KEY }}
          NOMAC_NO_AUTO_UPDATE: "1"
        run: |
          if [ -z "$NOMAC_API_KEY" ]; then
            echo "::error::the NOMAC_API_KEY secret is not set"
            exit 1
          fi
          scripts/build-macos.sh --target aarch64-apple-darwin --target x86_64-apple-darwin \
            --drive boatparty-release --max-cost 2 --timeout 3000
      - name: Package
        run: |
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            scripts/release/package.sh "${{ needs.plan.outputs.version }}" "$target" \
              "target/nomac/boatparty-$target" dist
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, linux, macos]
    runs-on: boat
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and installer
        run: |
          cp scripts/install.sh dist/install.sh
          (cd dist && sha256sum boatparty-*.tar.gz install.sh > SHA256SUMS && cat SHA256SUMS)
          scripts/release/notes.sh "${{ needs.plan.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "boatparty $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" dist/*
      - name: Dry run summary
        if: needs.plan.outputs.publish != 'true'
        run: |
          echo "Dry run: would publish ${{ needs.plan.outputs.tag }} with:"
          ls -l dist
